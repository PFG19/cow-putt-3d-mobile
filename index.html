<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cow Putt 3D</title><style>:root{color-scheme:light}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#afd3b8;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;z-index:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 8px);left:9px;right:9px;display:flex;justify-content:space-between;align-items:start;gap:8px;pointer-events:none}.card{background:#fffffff2;border-radius:12px;padding:8px 10px;color:#214d37;box-shadow:0 4px 14px #14492d42;font-size:12px;line-height:1.35}#score strong{font-size:16px}#tools{display:flex;gap:5px;pointer-events:auto}button{border:2px solid #fff7;border-radius:13px;color:#173f31;background:#fffef0;box-shadow:0 3px 7px #17452e55;font-weight:800;font-family:inherit;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}button:active,.pressed{background:#ffd57b!important}#tools button{font-size:12px;padding:8px}#message{position:fixed;z-index:2;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 174px);margin:auto;max-width:520px;text-align:center;background:#fffce6ed;border-radius:10px;padding:7px;color:#26523b;font-weight:600;font-size:12px;pointer-events:none}#controls{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:6px 8px calc(env(safe-area-inset-bottom) + 7px);height:calc(169px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:6px;background:linear-gradient(transparent,#bde3c7bd 30%,#b4dcbcdb);pointer-events:none}#controls button{pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,47px);gap:3px}.pad button{font-size:20px;background:#fffffff0}.right{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,47px);gap:3px}.right button{font-size:11px;background:#fffef0f5;line-height:1.05}.right .jump{background:#ffdda2}.right .putt{background:#b9e0ff}.right .power{background:#e8f4d4}#result{position:fixed;inset:0;z-index:20;background:#163c2bad;display:none;align-items:center;justify-content:center;padding:18px}#result .card{max-width:320px;text-align:center;padding:24px;font-size:15px}#result button{padding:12px 18px;font-size:15px}#error{position:fixed;z-index:30;inset:15%;display:none;background:white;padding:24px;border-radius:12px}@media(max-width:355px){.pad{grid-template-columns:repeat(3,42px)}.right{grid-template-columns:repeat(3,44px)}}@media(max-height:560px){#controls{height:calc(133px + env(safe-area-inset-bottom))}.pad,.right{grid-template-rows:repeat(3,36px)}#message{bottom:calc(env(safe-area-inset-bottom) + 136px)}.card{font-size:10px}}@media(min-width:850px){#controls{max-width:760px;left:50%;right:auto;width:100%;transform:translateX(-50%)}#message{bottom:190px}}</style></head><body><div id="game"></div><div id="hud"><div id="score" class="card"><strong>🐄 Cow Putt 3D</strong><div id="stats">Hole 1 · Hammers 3 · Putts 0</div><div id="aimText">Aim 0° · Power 45%</div><div style="width:120px;height:8px;border-radius:9px;background:#c4d6c3;overflow:hidden;margin-top:4px"><div id="powerBar" style="width:45%;height:100%;background:linear-gradient(90deg,#86d3a2,#f1cc64,#ea896c)"></div></div></div><div id="tools"><button id="cameraBtn">Camera</button><button id="restartBtn">Restart</button></div></div><div id="message">Move to a raised hammer and tap JUMP to stomp it.</div><div id="controls"><div class="pad"><span></span><button data-hold="up" aria-label="Move up">▲</button><span></span><button data-hold="left" aria-label="Move left">◀</button><button data-hold="down" aria-label="Move down">▼</button><button data-hold="right" aria-label="Move right">▶</button><span></span><span></span><span></span></div><div class="right"><button data-hold="aimL">Aim ◀</button><button class="jump" id="jumpBtn">JUMP</button><button data-hold="aimR">Aim ▶</button><button class="power" id="lessBtn">Power −</button><button class="putt" id="puttBtn">PUTT</button><button class="power" id="moreBtn">Power +</button><span></span><span></span><span></span></div></div><div id="result"><div class="card"><h2 id="resultTitle"></h2><p id="resultBody"></p><button id="nextBtn">Next hole</button></div></div><div id="error">The 3D game could not start. Please reload in Safari with an internet connection.</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0xc5e9f1);scene.fog=new THREE.Fog(0xc5e9f1,34,95);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,130);let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('game').append(renderer.domElement)}catch(e){document.getElementById('error').style.display='block';throw e}scene.add(new THREE.HemisphereLight(0xffffff,0x60805a,2.4));const sun=new THREE.DirectionalLight(0xfff2d0,2.3);sun.position.set(-9,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=31;sun.shadow.camera.bottom=-31;scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const grass=mat(0x69a879),fair=mat(0x9ccc93),sand=mat(0xebd89e),white=mat(0xfcf8ef),dark=mat(0x38483d),pink=mat(0xeaaeb5),steel=mat(0xb4c0c7),wood=mat(0x987251),blue=mat(0x81c9e3),red=mat(0xe79972);function add(geo,m,parent=scene,x=0,y=0,z=0){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,p,x=0,y=0,z=0){return add(new THREE.BoxGeometry(w,h,d),m,p,x,y,z)}function ballShape(r,m,p,x=0,y=0,z=0){return add(new THREE.SphereGeometry(r,12,10),m,p,x,y,z)}function cyl(r,h,m,p,x=0,y=0,z=0){return add(new THREE.CylinderGeometry(r,r,h,16),m,p,x,y,z)}box(38,.25,64,grass,scene,0,-.19,-3);box(12,.025,43,fair,scene,0,-.04,-3);for(let z=-24;z<20;z+=6)for(let s of [-1,1])ballShape(1.5,grass,scene,s*(10+Math.random()*4),.25,z+Math.random()*2).scale.set(1.5,.6,1.4);for(const [x,z] of [[-8,2],[8,-7]])cyl(2.5,.06,sand,scene,x,.015,z).scale.set(1,.2,1.5);cyl(.46,.02,dark,scene,0,.025,-21);cyl(.31,.021,mat(0x25372e),scene,0,.041,-21);cyl(.03,2.3,white,scene,.42,1.18,-21);box(.7,.43,.04,red,scene,.79,1.98,-21);const golf=ballShape(.25,white,scene,0,.25,15);const cow=new THREE.Group();scene.add(cow);ballShape(.84,white,cow,0,1.05,0).scale.set(1,.84,1.2);for(const [x,z] of [[-.46,-.43],[.46,-.43],[-.46,.42],[.46,.42]]){box(.25,.65,.27,white,cow,x,.45,z);box(.28,.12,.28,dark,cow,x,.09,z)}ballShape(.35,dark,cow,-.54,1.3,.1).scale.set(.55,.54,.9);ballShape(.27,dark,cow,.5,1.21,.4).scale.set(.5,.6,1);ballShape(.6,white,cow,0,1.5,-.83);for(const s of [-1,1]){ballShape(.21,white,cow,s*.57,1.85,-.82).scale.set(1.5,.55,.8);ballShape(.045,dark,cow,s*.2,1.68,-1.36);cyl(.075,.26,sand,cow,s*.34,2.07,-.88)}ballShape(.29,pink,cow,0,1.39,-1.39).scale.set(1.15,.57,.59);const putter=new THREE.Group();cow.add(putter);putter.position.set(.85,1.4,-.12);cyl(.038,1.6,steel,putter,.1,-.55,-.45).rotation.z=.2;cyl(.065,.32,dark,putter,-.04,.15,-.45).rotation.z=.2;box(.76,.17,.26,steel,putter,.25,-1.32,-.45);let hammers=[],dots=[],level=0,putts=0,aim=-Math.PI/2,power=.45,velocity=new THREE.Vector2(),moving=false,jump=0,jumping=false,hit=false,won=false,camMode=0,elapsed=0,messageUntil=0;const clock=new THREE.Clock(),keys=new Set(),holds=new Set(),layouts=[{cow:[0,18],ball:[0,15],hammers:[[0,10],[0,3],[0,-7]]},{cow:[-2,18],ball:[-2,15],hammers:[[-2,9],[1,2],[-1,-8],[0,-14]]},{cow:[2,18],ball:[2,15],hammers:[[2,10],[-1,4],[1,-5],[-1,-13]]}],byId=id=>document.getElementById(id);function msg(s,d=2.8){byId('message').textContent=s;messageUntil=elapsed+d}function display(){byId('stats').textContent=`Hole ${level+1} · Hammers ${hammers.filter(h=>h.alive).length} · Putts ${putts}`;byId('aimText').textContent=`Aim ${Math.round((aim+Math.PI/2)*180/Math.PI)}° · Power ${Math.round(power*100)}%`;byId('powerBar').style.width=Math.round(power*100)+'%'}function createHammer(x,z,i){const group=new THREE.Group();scene.add(group);group.position.set(x,0,z);cyl(.56,.055,dark,scene,x,.017,z);cyl(.11,1.1,wood,group,0,.55,0);box(.95,.32,.32,steel,group,0,1.12,0);return{x,z,group,alive:true,phase:i*1.4+1}}function reset(){for(const h of hammers)scene.remove(h.group);hammers=[];const l=layouts[level];cow.position.set(l.cow[0],0,l.cow[1]);golf.position.set(l.ball[0],.25,l.ball[1]);for(let i=0;i<l.hammers.length;i++)hammers.push(createHammer(...l.hammers[i],i));putts=0;aim=-Math.PI/2;power=.45;velocity.set(0,0);moving=false;jump=0;jumping=false;hit=false;won=false;byId('result').style.display='none';msg('Move to a raised hammer and tap JUMP to stomp it.',5);display()}function stomp(){if(jumping||won)return;jumping=true;jump=0;hit=false}function putt(){if(won||moving)return;if(hammers.some(h=>h.alive)){msg('Pulverize all hammers first.');return}if(Math.hypot(cow.position.x-golf.position.x,cow.position.z-golf.position.z)>2.4){msg('Stand near the golf ball to putt.');return}putts++;velocity.set(Math.cos(aim),Math.sin(aim)).multiplyScalar(2+power*13);moving=true;putter.rotation.x=-.8;display();msg('Follow your shot. Adjust aim and power for another putt.',3)}function win(){won=true;moving=false;velocity.set(0,0);golf.position.set(0,.2,-21);byId('resultTitle').textContent=level===2?'Course cleared!':'Nice putt!';byId('resultBody').textContent=`You stomped the hammers and holed out in ${putts} putt${putts===1?'':'s'}.`;byId('nextBtn').textContent=level===2?'Play again':'Next hole';byId('result').style.display='flex'}function tick(dt){elapsed+=dt;if(!won){let left=keys.has('KeyA')||keys.has('ArrowLeft')||holds.has('left'),right=keys.has('KeyD')||keys.has('ArrowRight')||holds.has('right'),up=keys.has('KeyW')||keys.has('ArrowUp')||holds.has('up'),down=keys.has('KeyS')||keys.has('ArrowDown')||holds.has('down'),dx=Number(right)-Number(left),dz=Number(down)-Number(up),l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;cow.position.x=THREE.MathUtils.clamp(cow.position.x+dx*5.5*dt,-5.65,5.65);cow.position.z=THREE.MathUtils.clamp(cow.position.z+dz*5.5*dt,-22,18.8);if(dx||dz)cow.rotation.y=THREE.MathUtils.lerp(cow.rotation.y,Math.atan2(-dx,-dz),Math.min(1,dt*10));if(keys.has('KeyQ')||holds.has('aimL'))aim-=dt*1.3;if(keys.has('KeyE')||holds.has('aimR'))aim+=dt*1.3;if(keys.has('ShiftLeft')||keys.has('ShiftRight')){if(keys.has('ArrowUp'))power=Math.min(1,power+dt*.5);if(keys.has('ArrowDown'))power=Math.max(.08,power-dt*.5)}if(jumping){jump+=dt;let s=jump/.68;cow.position.y=Math.sin(Math.PI*Math.min(s,1))*1.6;if(s>.48&&!hit)for(const h of hammers)if(h.alive&&h.group.position.y>-.38&&Math.hypot(cow.position.x-h.x,cow.position.z-h.z)<1.3){h.alive=false;hit=true;h.group.visible=false;msg(hammers.some(q=>q.alive)?'Hammer stomped! Find the next one.':'Path clear. Stand by the ball and aim your putt.',3.4);display();break}if(s>=1){cow.position.y=0;jumping=false}}else cow.position.y=0;for(const h of hammers)if(h.alive)h.group.position.y=THREE.MathUtils.lerp(h.group.position.y,Math.sin(elapsed*2.2+h.phase)>.05?0:-1.5,Math.min(1,dt*9));if(moving){golf.position.x+=velocity.x*dt;golf.position.z+=velocity.y*dt;velocity.multiplyScalar(Math.exp(-.65*dt));if(Math.hypot(golf.position.x,golf.position.z+21)<.55){win();return}if(Math.abs(golf.position.x)>6){golf.position.x=THREE.MathUtils.clamp(golf.position.x,-6,6);velocity.x*=-.5}if(golf.position.z< -22.5||golf.position.z>19.5){golf.position.z=THREE.MathUtils.clamp(golf.position.z,-22.5,19.5);velocity.y*=-.5}if(velocity.length()<.24){velocity.set(0,0);moving=false;msg('Ball stopped. Move near it and putt again.',3)}}putter.rotation.x=THREE.MathUtils.lerp(putter.rotation.x,0,Math.min(1,dt*5));display();if(elapsed>messageUntil)byId('message').textContent=hammers.some(h=>h.alive)?'Move over a raised hammer and tap JUMP.':'Use Aim ◀ ▶, Power − +, then PUTT near the ball.'}for(const dot of dots)scene.remove(dot);dots=[];if(!hammers.some(h=>h.alive)&&!won&&!moving)for(let i=1;i<=17;i++){const d=i*.55,x=golf.position.x+Math.cos(aim)*d,z=golf.position.z+Math.sin(aim)*d;if(Math.abs(x)>6||z< -22.5||z>19.5)break;const o=ballShape(.07,blue,scene,x,.045,z);o.castShadow=false;dots.push(o)}const target=camMode?new THREE.Vector3(0,0,-4):new THREE.Vector3(cow.position.x*.25,0,cow.position.z-4),pos=camMode?new THREE.Vector3(0,32,4):new THREE.Vector3(cow.position.x,15,cow.position.z+16);camera.position.lerp(pos,Math.min(1,dt*3));camera.lookAt(target);renderer.render(scene,camera)}function frame(){requestAnimationFrame(frame);tick(Math.min(.045,clock.getDelta()))}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});for(const b of document.querySelectorAll('[data-hold]')){const k=b.dataset.hold;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);holds.add(k);b.classList.add('pressed')});for(const eventName of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(eventName,()=>{holds.delete(k);b.classList.remove('pressed')})}byId('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();stomp()});byId('puttBtn').addEventListener('pointerdown',e=>{e.preventDefault();putt()});byId('lessBtn').onclick=()=>{power=Math.max(.08,power-.07);display()};byId('moreBtn').onclick=()=>{power=Math.min(1,power+.07);display()};byId('cameraBtn').onclick=()=>camMode=1-camMode;byId('restartBtn').onclick=reset;byId('nextBtn').onclick=()=>{level=(level+1)%3;reset()};addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Space')stomp();if(e.code==='Enter')putt();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();holds.clear()});reset();frame();</script></body></html>
