 THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,130);let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement)}catch(e){document.getElementById('error').style.display='block';throw e}scene.add(new THREE.HemisphereLight(0xeef9ff,0x59764d,2.3));const sun=new THREE.DirectionalLight(0xfff3d1,2.4);sun.position.set(-10,23,13);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=32;sun.shadow.camera.bottom=-32;scene.add(sun);const mat=(color,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness:.8,metalness}),grass=mat(0x70ae78),fairway=mat(0x9bc98a),sand=mat(0xe5d59c),white=mat(0xfdf8ed),black=mat(0x323d3e),pink=mat(0xeeb8b4),steel=mat(0xb1bfc8,.5),wood=mat(0x9b6b46),rim=mat(0x354d3d),blue=mat(0x89c4db),red=mat(0xe99162);function mesh(geo,m,parent=scene,x=0,y=0,z=0){let o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,parent,x=0,y=0,z=0){return mesh(new THREE.BoxGeometry(w,h,d),m,parent,x,y,z)}function sphere(r,m,parent,x=0,y=0,z=0){return mesh(new THREE.SphereGeometry(r,12,10),m,parent,x,y,z)}function cylinder(rt,rb,h,m,parent,x=0,y=0,z=0){return mesh(new THREE.CylinderGeometry(rt,rb,h,16),m,parent,x,y,z)}box(42,.25,64,grass,scene,0,-.18,-3);box(13,.02,42,fairway,scene,0,-.02,-3);for(let z=-24;z<21;z+=5){for(let side of [-1,1]){let b=sphere(1.7,grass,scene,side*(12+Math.random()*6),.4,z+Math.random()*3);b.scale.set(1.6,.6,1.3)}}for(const [x,z] of [[-9,-8],[8,2],[-8,12]]){let s=cylinder(2.6,3.4,.08,sand,scene,x,.02,z);s.scale.set(1,.2,1.5)}cylinder(.48,.48,.015,rim,scene,0,.022,-21);cylinder(.34,.34,.02,black,scene,0,.035,-21);cylinder(.035,.035,2.6,white,scene,.44,1.3,-21);box(.75,.48,.04,red,scene,.81,2.2,-21);const ball=sphere(.26,white,scene,0,.28,15),ballShadow=cylinder(.28,.28,.012,mat(0x62836a),scene,0,.016,15);const cow=new THREE.Group();scene.add(cow);let body=sphere(.83,white,cow,0,1.08,0);body.scale.set(1,.83,1.2);for(let [x,z] of [[-.46,-.44],[.48,-.28],[-.42,.38],[.5,.46]]){box(.25,.72,.26,white,cow,x,.48,z);box(.31,.12,.3,black,cow,x,.08,z)}sphere(.34,black,cow,-.56,1.35,.04).scale.set(.5,.55,1);sphere(.28,black,cow,.57,1.18,.38).scale.set(.48,.55,.95);let head=sphere(.6,white,cow,0,1.5,-.84);head.scale.set(1,.89,.88);for(let s of [-1,1]){sphere(.22,white,cow,s*.58,1.88,-.84).scale.set(1.5,.53,.7);sphere(.055,black,cow,s*.22,1.7,-1.3);let horn=cylinder(.03,.11,.25,sand,cow,s*.33,2.1,-.86);horn.rotation.z=-s*.24}sphere(.3,pink,cow,0,1.39,-1.38).scale.set(1.15,.55,.55);for(let s of [-1,1])sphere(.045,black,cow,s*.13,1.39,-1.54);const putter=new THREE.Group();cow.add(putter);putter.position.set(.8,1.38,-.12);cylinder(.035,.035,1.62,steel,putter,.1,-.54,-.44).rotation.z=.2;cylinder(.065,.065,.32,black,putter,-.04,.16,-.44).rotation.z=.2;box(.77,.18,.26,steel,putter,.26,-1.32,-.44);let markers=[],hammers=[],level=0,putts=0,aim=-Math.PI/2,power=.45,ballVel=new THREE.Vector2(),ballMoving=false,jump=0,jumping=false,stompDone=false,won=false,camMode=0,clock=new THREE.Clock(),elapsed=0,messageUntil=0;const stats=document.getElementById('stats'),hint=document.getElementById('hint'),angleEl=document.getElementById('angle'),percent=document.getElementById('percent'),bar=document.getElementById('bar'),result=document.getElementById('result'),keys=new Set(),holds=new Set(),layouts=[{cow:[0,18],ball:[0,15],hammers:[[0,10],[0,3],[0,-7]]},{cow:[-2,18],ball:[-2,15],hammers:[[-2,9],[1,2],[-1,-8],[0,-14]]},{cow:[2,18],ball:[2,15],hammers:[[2,10],[-1,4],[1,-5],[-1,-13]]}];function note(text,d=2.5){hint.textContent=text;messageUntil=elapsed+d}function updateStats(){stats.textContent=`Hole ${level+1} · Ha t;if(!won){let left=keys.has('KeyA')||keys.has('ArrowLeft')||holds.has('left'),right=keys.has('KeyD')||keys.has('ArrowRight')||holds.has('right'),up=keys.has('KeyW')||keys.has('ArrowUp')||holds.has('up'),down=keys.has('KeyS')||keys.has('ArrowDown')||holds.has('down');let dx=Number(right)-Number(left),dz=Number(down)-Number(up),len=Math.hypot(dx,dz)||1;dx/=len;dz/=len;cow.position.x=THREE.MathUtils.clamp(cow.position.x+dx*5.5*dt,-5.75,5.75);cow.position.z=THREE.MathUtils.clamp(cow.position.z+dz*5.5*dt,-22,18.7);if(dx||dz)cow.rotation.y=THREE.MathUtils.lerp(cow.rotation.y,Math.atan2(-dx,-dz),Math.min(1,dt*12));if(keys.has('KeyQ')||holds.has('aimL'))aim-=dt*1.35;if(keys.has('KeyE')||holds.has('aimR'))aim+=dt*1.35;if(keys.has('ShiftLeft')||keys.has('ShiftRight')){if(keys.has('ArrowUp'))power=Math.min(1,power+dt*.5);if(keys.has('ArrowDown'))power=Math.max(.08,power-dt*.5)}if(jumping){jump+=dt;let stage=jump/.68;cow.position.y=Math.sin(Math.PI*Math.min(stage,1))*1.6;if(stage>.48&&!stompDone){for(let h of hammers){if(h.alive&&h.group.position.y>-.35&&Math.hypot(cow.position.x-h.x,cow.position.z-h.z)<1.2){h.alive=false;stompDone=true;h.group.visible=false;note(hammers.some(h=>h.alive)?'Hammer pulverized! Find the next one.':'Path cleared! Stand near the ball, aim and putt.',3);updateStats();break}}}if(stage>=1){cow.position.y=0;jumping=false}}else cow.position.y=0;for(let h of hammers)if(h.alive){let visible=Math.sin(elapsed*2.2+h.phase)>.05;h.group.position.y=THREE.MathUtils.lerp(h.group.position.y,visible?0:-1.5,Math.min(1,dt*9))}if(ballMoving){ball.position.x+=ballVel.x*dt;ball.position.z+=ballVel.y*dt;ballShadow.position.x=ball.position.x;ballShadow.position.z=ball.position.z;ballVel.multiplyScalar(Math.exp(-.65*dt));for(let h of hammers)if(h.alive&&h.group.position.y>-.35&&Math.hypot(ball.position.x-h.x,ball.position.z-h.z)<.78){ballVel.multiplyScalar(-.47);note('The hammer deflected your ball!',2)}if(Math.hypot(ball.position.x,ball.position.z+21)<.5){victory();return}if(Math.abs(ball.position.x)>6.2){ball.position.x=THREE.MathUtils.clamp(ball.position.x,-6.2,6.2);ballVel.x*=-.5}if(ball.position.z< -22.5||ball.position.z>19.5){ball.position.z=THREE.MathUtils.clamp(ball.position.z,-22.5,19.5);ballVel.y*=-.5}if(ballVel.length()<.25){ballVel.set(0,0);ballMoving=false;note('Ball stopped. Walk up, adjust aim and power, and putt again.',3)}}putter.rotation.x=THREE.MathUtils.lerp(putter.rotation.x,0,Math.min(1,dt*5));updateStats();if(elapsed>messageUntil)hint.textContent=hammers.some(h=>h.alive)?'Stomp raised hammers before putting.':'Aim with arrows, set power, and putt near the ball.'}for(const m of markers)scene.remove(m);markers=[];if(!hammers.some(h=>h.alive)&&!won&&!ballMoving){for(let i=1;i<=14;i++){let d=i*.46,x=ball.position.x+Math.cos(aim)*d,z=ball.position.z+Math.sin(aim)*d;if(Math.abs(x)>6.2||z< -22.5||z>19.5)break;let m=sphere(.065,blue,scene,x,.05,z);m.castShadow=false;markers.push(m)}}let target=camMode===0?new THREE.Vector3(cow.position.x*.35,0,cow.position.z-4):new THREE.Vector3(0,0,-3),pos=camMode===0?new THREE.Vector3(cow.position.x,15,cow.position.z+16):new THREE.Vector3(0,32,6);camera.position.lerp(pos,Math.min(1,dt*3));camera.lookAt(target);renderer.render(scene,camera)}function animate(){requestAnimationFrame(animate);tick(Math.min(clock.getDelta(),.045))}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;keys.add(e.code);if(e.code==='Space')jumpAction();if(e.code==='Enter')puttAction();if(e.code==='KeyR')init()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();holds.clear()});for(const b of document.querySelectorAll('[data-hold]')){const key=b.dataset.hold;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);holds.add(key)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>holds.delete(key))}document.getElementById('jump').onclick=jumpAction;document.getElementById('putt').onclick=puttAction;document.getElementById('less').onclick=()=>{power=Math.max(.08,power-.08);updateStats()};document.getElementById('more').onclick=()=>{power=Math.min(1,power+.08);updateStats()};document.getElementById('reset').onclick=init;document.getElementById('cameraButton').onclick=()=>camMode=1-camMode;document.getElementById('next').onclick=()=>{level=(level+1)%3;init()};init();animate();</script></body></html>
